<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>playhouse</title>

    <!-- ===================================================== -->
    <!-- COMMON CSS -->
    <!-- ===================================================== -->

    <link rel="stylesheet" href="../css/jquery-ui.min.css" />

    <link rel="stylesheet" href="../css/bootstrap/bootstrap.css" />

    <style id="ui_style"></style>

    <link rel="stylesheet" href="../css/all.min.css" />

    <link rel="stylesheet" href="../css/draw.css" />

    <link rel="stylesheet" href="../css/styles.css" />

    <link rel="stylesheet" href="../css/unit_styles.css" />

    <link rel="stylesheet" href="../css/activities.css" />

    <link rel="stylesheet" href="../css/audio.css" />

    <!-- ===================================================== -->
    <!-- ACTIVITY CSS -->
    <!-- ===================================================== -->

    <link rel="stylesheet" href="../css/circle_underline_rewrite.css" />

    <!-- ===================================================== -->
    <!-- JQUERY -->
    <!-- ===================================================== -->

    <script src="../js/jquery-3.4.1.min.js" type="text/javascript"></script>

    <script src="../js/jquery-ui.min.js" type="text/javascript"></script>

    <script
      src="../js/bootstrap/bootstrap.bundle.min.js"
      type="text/javascript"
    ></script>

    <script
      src="../js/jquery.ui.touch-punch.min.js"
      type="text/javascript"
    ></script>

    <!-- ===================================================== -->
    <!-- TEMPLATE DATA -->
    <!-- ===================================================== -->

    <script src="../js/data/templateData.js" type="text/javascript"></script>

    <!-- ===================================================== -->
    <!-- ACTIVITY LIST -->
    <!-- ===================================================== -->

    <script src="../js/data/activityList.js" type="text/javascript"></script>

    <!-- ===================================================== -->
    <!-- ACTIVITY DATA -->
    <!-- ===================================================== -->

    <script
      src="../js/data/circle_underline_rewrite_data.js"
      type="text/javascript"
    ></script>

    <script src="../js/build/jsonRender.js"></script>
  <link rel="stylesheet" href="../../../css/laptop-layout.css">
<link rel="stylesheet" href="../../../css/g4-laptop-nov.css?v=20261102">
</head>

  <body>
    <!-- ===================================================== -->
    <!-- MASK -->
    <!-- ===================================================== -->

    <div class="mask_parent">
      <div class="mask_left"></div>

      <div class="mask_right"></div>
    </div>

    <!-- ===================================================== -->
    <!-- LOADING -->
    <!-- ===================================================== -->

    <div class="loading">
      <div class="loader"></div>
    </div>

    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <header class="fixed-top"></header>

    <!-- ===================================================== -->
    <!-- MAIN CONTENT -->
    <!-- ===================================================== -->

    <div class="mainContent">
      <!-- =============================================== -->
      <!-- FEEDBACK POPUP -->
      <!-- =============================================== -->

      <div id="feedbackPopup" class="modal fade" role="dialog">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div>
              <button
                type="button"
                class="close closeFeedback"
                data-dismiss="modal"
              >
                &times;
              </button>
            </div>

            <div class="modal-body">
              <video id="video_1" src="../videos/goodjob.mp4" preload></video>

              <video id="video_2" src="../videos/tryagain.mp4" preload></video>
            </div>
          </div>
        </div>
      </div>

      <!-- =============================================== -->
      <!-- ACTIVITY WRAPPER -->
      <!-- =============================================== -->

      <div class="container content_wrap activity_wrap">
        <!-- SCREEN NUMBER -->

        <div class="fixed-top screen_numbers_wrap" style="z-index: 2"></div>

        <!-- ACTIVITY CONTROLS -->

        <div
          class="activity_buts d-none"
          data-buttons="ccss,link,tips,homework"
        >
          <div class="ccss_content" data-height="">L.1.1</div>

          <div class="link_content" data-height=""></div>

          <div class="tips_content" data-height="">
            <span class="pop_title"> Subject and Object Pronouns </span>

            <br />

            Use subject pronouns for subjects and object pronouns for objects.
          </div>

          <div class="homework_content" data-height="">
            Have your child read the rewritten sentences.
          </div>
        </div>

        <!-- =========================================== -->
        <!-- ACTIVITY AREA -->
        <!-- =========================================== -->

        <div
          class="activity_container activity_area circle_underline_activity mx-auto"
          data-activity="circleunderline"
        ></div>
      </div>
    </div>

    <!-- ===================================================== -->
    <!-- ACTIVITY CONTROL MODAL -->
    <!-- ===================================================== -->

    <div
      class="modal fade activityCtrlPanel"
      tabindex="-1"
      role="dialog"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <div class="ctrlIcon"></div>

            <h4 class="modal-title"></h4>

            <button type="button" class="close" data-dismiss="modal">
              &times;
            </button>
          </div>

          <div class="modal-body"></div>
        </div>
      </div>
    </div>

    <!-- ===================================================== -->
    <!-- SUB FOOTER -->
    <!-- ===================================================== -->

    <div class="sub_footer">
      <div class="container sub_footer_buttons_wrap"></div>
    </div>

    <footer class="fixed-bottom"></footer>

    <!-- ===================================================== -->
    <!-- MEDIA LIST -->
    <!-- ===================================================== -->

    <script>
      var _mediaList = {
        image: [],

        audio: [],

        video: [],
      };
    </script>

    <!-- ===================================================== -->
    <!-- BUILD FILES -->
    <!-- ===================================================== -->

    <script src="../js/build/toolbar.js" type="text/javascript"></script>

    <script src="../js/build/template.js" type="text/javascript"></script>

    <!-- OUR BUILD -->

    <script
      src="../js/build/circle_underline_rewrite.js"
      type="text/javascript"
    ></script>

    <script src="../js/build/audio.js"></script>

    <script src="../js/build/radio_build.js" type="text/javascript"></script>

    <!-- ===================================================== -->
    <!-- GENERAL FUNCTIONS -->
    <!-- ===================================================== -->

    <script src="../js/generalfunctions.js" type="text/javascript"></script>

    <!-- ===================================================== -->
    <!-- OUR ACTIVITY -->
    <!-- ===================================================== -->

    <script
      src="../js/activity/circle_underline_rewrite.js"
      type="text/javascript"
    ></script>

    <!-- ===================================================== -->
    <!-- ACTIVITIES -->
    <!-- ===================================================== -->

    <script src="../js/activities.js" type="text/javascript"></script>

    <script src="../js/loading.js" type="text/javascript"></script>

    <script src="../js/sketchpad.js" type="text/javascript"></script>
  <script src="../../../js/laptop-layout.js"></script>
<script src="../../../js/g4-laptop-nov.js?v=20261102"></script>
</body>
</html>
