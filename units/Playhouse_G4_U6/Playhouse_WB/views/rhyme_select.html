<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Playhouse</title>

    <!-- =========================================
         CSS
    ========================================== -->

    <link rel="stylesheet" href="../css/jquery-ui.min.css" />

    <link rel="stylesheet" href="../css/bootstrap/bootstrap.css" />

    <style id="ui_style"></style>

    <link rel="stylesheet" href="../css/all.min.css" />

    <link rel="stylesheet" href="../css/draw.css" />

    <link rel="stylesheet" href="../css/audio.css" />

    <link rel="stylesheet" href="../css/styles.css" />

    <link rel="stylesheet" href="../css/unit_styles.css" />

    <link rel="stylesheet" href="../css/activities.css" />

    <!-- Activity CSS -->

    <link rel="stylesheet" href="../css/rhyme_select.css" />

    <!-- =========================================
         LIBRARIES
    ========================================== -->

    <script src="../js/jquery-3.4.1.min.js"></script>

    <script src="../js/jquery-ui.min.js"></script>

    <script src="../js/bootstrap/bootstrap.bundle.min.js"></script>

    <script src="../js/jquery.ui.touch-punch.min.js"></script>

    <!-- =========================================
         DATA
    ========================================== -->

    <script src="../js/data/templateData.js"></script>

    <script src="../js/data/activityList.js"></script>

    <script src="../js/data/rhyme_select_data.js"></script>

    <script src="../js/build/jsonRender.js"></script>
  </head>

  <body>
    <!-- =========================================
         MASK
    ========================================== -->

    <div class="mask_parent">
      <div class="mask_left"></div>

      <div class="mask_right"></div>
    </div>

    <!-- =========================================
         LOADING
    ========================================== -->

    <div class="loading">
      <div class="loader"></div>
    </div>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="fixed-top"></header>

    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <div class="mainContent">
      <!-- =======================================
           FEEDBACK VIDEO POPUP
      ======================================== -->

      <div id="feedbackPopup" class="modal fade" role="dialog">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div>
              <button
                type="button"
                class="close closeFeedback"
                data-dismiss="modal"
              >
                &times;
              </button>
            </div>

            <div class="modal-body">
              <!-- CORRECT -->

              <video id="video_1" src="../videos/goodjob.mp4" preload></video>

              <!-- WRONG -->

              <video id="video_2" src="../videos/tryagain.mp4" preload></video>
            </div>
          </div>
        </div>
      </div>

      <!-- =======================================
           ACTIVITY WRAPPER
      ======================================== -->

      <div class="container content_wrap activity_wrap">
        <div class="screen_numbers_wrap"></div>

        <div class="activity_buts d-none" data-buttons=""></div>

        <div class="activity_area rhyme_select_activity mx-auto"></div>
      </div>
    </div>

    <!-- =========================================
         SUB FOOTER
    ========================================== -->

    <div class="sub_footer">
      <div class="container sub_footer_buttons_wrap"></div>
    </div>

    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="fixed-bottom"></footer>

    <!-- =========================================
         MEDIA
    ========================================== -->

    <script>
      var _mediaList = {
        image: [],
        audio: [],
        video: [],
      };
    </script>

    <!-- =========================================
         BUILD
    ========================================== -->

    <script src="../js/build/toolbar.js"></script>

    <script src="../js/build/template.js"></script>

    <script src="../js/build/audio.js"></script>

    <script src="../js/build/rhyme_select.js"></script>

    <!-- =========================================
         GENERAL
    ========================================== -->

    <script src="../js/generalfunctions.js"></script>

    <!-- =========================================
         ACTIVITY
    ========================================== -->

    <script src="../js/activity/rhyme_select.js"></script>
    <script src="../js/audioControls.js" type="text/javascript"></script>
    <script src="../js/build/radio_build.js" type="text/javascript"></script>
    <script src="../js/activities.js"></script>

    <script src="../js/loading.js"></script>
  </body>
</html>
